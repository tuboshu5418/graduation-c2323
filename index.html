<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我们班的毕业纪念册</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 音乐播放器 -->
  <div class="music-player" id="musicPlayer">
    <button class="music-toggle" id="musicToggle" onclick="toggleMusic()">
      <svg class="music-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
    </button>
    <div class="music-panel" id="musicPanel">
      <div class="music-header">
        <div class="music-info">
          <span class="music-title">干杯</span>
          <span class="music-artist">五月天</span>
        </div>
        <button class="close-panel" onclick="togglePanel()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="music-controls">
        <button onclick="togglePlay()" id="playBtn" class="play-btn">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <div class="progress-container" onclick="seekTo(event)">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="time-display">
          <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
        </span>
      </div>
      <div class="lyrics-container" id="lyricsContainer">
        <div class="lyrics-content" id="lyricsContent">加载歌词中...</div>
      </div>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="app-container">
    <!-- 登录页 -->
    <div id="loginPage" class="page active">
      <div class="login-header">
        <div class="login-icon">🎓</div>
        <h1>毕业纪念册</h1>
        <p class="login-subtitle">我们共同的美好时光</p>
      </div>
      <div class="login-form">
        <div class="input-wrapper">
          <input type="text" id="nameInput" class="input" placeholder="输入你的姓名" autocomplete="off">
          <span class="input-icon">👤</span>
        </div>
        <div class="input-wrapper">
          <input type="password" id="passwordInput" class="input" placeholder="输入密码">
          <span class="input-icon">🔐</span>
        </div>
        <p class="login-hint">默认密码：111111</p>
        <button onclick="login()" class="btn btn-primary">进入纪念册</button>
        <p class="login-link" onclick="showNameList()">输了名字没反应？是不是开发时名字打错了</p>
        <div id="loginError" class="error"></div>
      </div>
      
      <!-- 名字选择弹窗 -->
      <div id="nameListModal" class="name-list-modal" style="display:none;" onclick="if(event.target===this)hideNameList()">
        <div class="name-list-content">
          <div class="name-list-header">
            <h3>选择你的名字</h3>
            <button onclick="hideNameList()" class="modal-close">✕</button>
          </div>
          <div class="name-list-body">
            <div id="nameListOptions" class="name-options"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 主页 -->
    <div id="mainPage" class="page">
      <!-- 顶部导航 -->
      <div class="nav-bar">
        <div class="nav-title">
          <span id="pageTitle">班级相册</span>
        </div>
        <div class="nav-actions">
          <span class="user-badge" id="userBadge"></span>
          <button onclick="logout()" class="nav-btn">退出</button>
        </div>
      </div>

      <!-- 底部标签栏 -->
      <div class="tab-bar" id="tabBar"></div>

      <!-- 内容区域 -->
      <div class="content-area" id="contentArea"></div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">标题</h3>
        <button class="modal-close" onclick="closeModal()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
