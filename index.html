<!-- 登录页 -->
<div id="loginPage" class="page active">
  <div class="login-header">
    <div class="login-icon">🎓</div>
    <h1>毕业纪念册</h1>
    <p class="login-subtitle">我们共同的美好时光</p>
  </div>
  <div class="login-form">
    <div class="input-wrapper">
      <input type="text" id="nameInput" class="input" placeholder="输入你的姓名" autocomplete="off">
      <span class="input-icon">👤</span>
    </div>
    <div class="input-wrapper">
      <input type="password" id="passwordInput" class="input" placeholder="输入密码">
      <span class="input-icon">🔐</span>
    </div>
    <p class="login-hint">默认密码：111111</p>
    <button onclick="login()" class="btn btn-primary">进入纪念册</button>
    <p class="login-link" onclick="showNameList()">输了名字没反应？是不是开发时名字打错了</p>
    <div id="loginError" class="error"></div>
  </div>
  
  <!-- 名字选择弹窗（隐藏） -->
  <div id="nameListModal" class="name-list-modal" style="display:none;">
    <div class="name-list-content">
      <div class="name-list-header">
        <h3>选择你的名字</h3>
        <button onclick="hideNameList()" class="modal-close">✕</button>
      </div>
      <div class="name-list-body">
        <div id="nameListOptions" class="name-options"></div>
      </div>
    </div>
  </div>
</div>
